services:
  amane:
    image: ghcr.io/zipenok/amane:latest
    container_name: amane
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8016:8016"
      # 可选的 Emby 302 网关
      - "8017:8017"
    volumes:
      - ./data:/data
      - /path/to/media:/media
    environment:
      AMANE_PORT: "8016"
      AMANE_DATA_DIR: "/data"
      AMANE_SAFE_DIRS: "/media"
      AMANE_SUPERVISED: "1"
      # 可选：限制 glibc 的内存 Arena 数量，减少多线程运行后滞留在进程中的内存。
      # 默认注释掉；仅在内存长期不回落时启用，修改后需重建容器才会生效。
      # MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, os, sys;
          port = int(os.environ.get("AMANE_PORT", "8016"));
          conn = http.client.HTTPConnection("127.0.0.1", port, timeout=3);
          conn.request("GET", "/api/health");
          sys.exit(0 if conn.getresponse().status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s