name: Publish container

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源码仓库中的分支或 tag"
        required: true
        default: dev
      version:
        description: "镜像版本，例如 0.26.0"
        required: true
        default: 0.26.0
      platforms:
        description: "构建平台"
        required: true
        default: linux/amd64,linux/arm64
      latest:
        description: "同时更新 latest 标签"
        required: true
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/zipenok/amane

jobs:
  publish:
    name: Build and push GHCR image
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source secrets and access
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_REPOSITORY" || { echo "::error::SOURCE_REPOSITORY secret is required"; exit 1; }
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::SOURCE_REPO_TOKEN secret is required"; exit 1; }
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --header "Authorization: Bearer $SOURCE_REPO_TOKEN"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/$SOURCE_REPOSITORY")"
          if [ "$status" != "200" ]; then
            echo "::error::SOURCE_REPO_TOKEN cannot access SOURCE_REPOSITORY (HTTP $status)"
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          LATEST: ${{ github.event_name == 'release' || inputs.latest }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.LATEST }}
          labels: |
            org.opencontainers.image.title=Amane
            org.opencontainers.image.description=Amane distribution container
            org.opencontainers.image.source=https://github.com/ZiPenOk/Amane

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
